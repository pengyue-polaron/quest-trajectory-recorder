[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-trajectory-recorder"
version = "0.2.0"
description = "Robust receiver and plotting tools for the controller-tracking Quest APK / Quest trajectory streams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "embodied-ops[teleop-zmq]>=0.10,<0.11",
  "pyzmq>=25",
]
authors = [{ name = "Pengyue" }]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quest-receive = "quest_trajectory_recorder.receiver:main"
quest-analyze = "quest_trajectory_recorder.analyze:main"
quest-clean = "quest_trajectory_recorder.clean:main"
quest-plot2d = "quest_trajectory_recorder.plot2d:main"
quest-plot3d = "quest_trajectory_recorder.plot3d:main"
quest-live3d = "quest_trajectory_recorder.live3d:main"
quest-tracker-hub = "quest_trajectory_recorder.quest_tracker_hub:main"
quest-synthetic-target = "quest_trajectory_recorder.synthetic_target:main"
quest-doctor = "quest_trajectory_recorder.device_doctor:main"
quest-adb = "quest_trajectory_recorder.device_cli:main"
quest-source = "quest_trajectory_recorder.source_cli:main"
quest-align = "quest_trajectory_recorder.alignment_cli:main"
quest-calibration = "quest_trajectory_recorder.calibration_cli:main"
quest-profile = "quest_trajectory_recorder.profile_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
