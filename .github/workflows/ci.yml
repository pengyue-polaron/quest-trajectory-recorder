name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,foxglove]" ruff
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: bash -n scripts/*.sh
      - uses: extractions/setup-just@v3
      - run: just --fmt --check
      - run: just --list

  foxglove-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foxglove/quest-teleop-controls
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: foxglove/quest-teleop-controls/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run package
